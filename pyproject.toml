[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-atlas"
version = "0.1.0"
description = "Deterministic ingestion and classification for the Skill catalog"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
